<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply · Bike Builders of Berkeley</title>
  <meta name="description" content="Become a Bike Builder. We're looking for UC Berkeley students of every major who are passionate about building bikes.">
  <meta name="theme-color" content="#003262">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-header="light">
  <div data-site-header></div>

  <main id="main">
    <!-- ===== Hero ===== -->
    <section class="hero hero--apply">
      <div class="hero__media"><img src="assets/img/hero-apply.jpg" alt="The Bike Builders team at our Sea Otter Classic booth" fetchpriority="high"></div>
      <div class="ribbon ribbon--hero" data-ribbon="Community • Join now • Applications open • Become a bike builder • Open to all majors" data-ribbon-closed="Community • Become a bike builder • Open to all majors • See you in the spring"></div>
      <div class="container hero__content">
        <h1 class="h1" style="font-size:clamp(2.5rem,4.5vw + .5rem,4.25rem)">Join our Community!</h1>
        <p class="lead" style="margin-top:1rem">We’re looking for students who are passionate about building bikes!<br>Calling on all cycleheads, regardless of major.</p>
        <div class="hero__actions">
          <a class="btn btn--ghost" href="#timeline" data-when-open>Coffee Chats</a>
          <a class="btn btn--action" href="#timeline" data-apply-link data-when-open>Applications Open – <span data-term></span></a>
          <a class="btn btn--ghost" href="#timeline" data-when-closed hidden>Applications Closed</a>
        </div>
      </div>
    </section>

    <!-- ===== Timeline ===== -->
    <section class="timeline" id="timeline" aria-label="Recruiting timeline" data-render="timeline"></section>

    <!-- ===== FAQ + Join ===== -->
    <section class="section bg-primary">
      <div class="container container--narrow faq">
        <h2 class="h1 rule-heading">FAQ</h2>
        <div class="faq__list" data-render="faq-apply"></div>
      </div>
      <div class="container join-strip" style="margin-top:clamp(4rem,8vw,6rem)">
        <div>
          <h2 class="h2">Join the Community</h2>
          <div class="btn-row" style="margin-top:1.25rem">
            <a class="btn btn--action" href="#timeline" data-apply-link data-when-open>Apply Now</a>
            <a class="btn btn--action" href="contact.html" data-when-closed hidden>Get in Touch</a>
            <a class="btn btn--ghost" href="projects.html">Our Projects</a>
          </div>
        </div>
        <div class="tilted" aria-hidden="true">
          <div class="frame"><img src="assets/img/join-cards.jpg" alt="" loading="lazy"></div>
          <div class="frame"><img src="assets/img/join-hats.jpg" alt="" loading="lazy"></div>
          <div class="frame"><img src="assets/img/join-crib.jpg" alt="" loading="lazy"></div>
          <div class="frame"><img src="assets/img/join-kahoot.jpg" alt="" loading="lazy"></div>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
