<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members · Bike Builders of Berkeley</title>
  <meta name="description" content="Meet the students behind Bike Builders of Berkeley.">
  <meta name="theme-color" content="#003262">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-header="primary" class="bg-primary">
  <div data-site-header></div>

  <main id="main" class="bg-primary members-page">
    <!-- Blue-toned team photo behind the page title, fading into the navy -->
    <div class="members-backdrop" aria-hidden="true"><img src="assets/img/bg-members.jpg" alt="" fetchpriority="high"></div>
    <!-- Decorative bike-part graphics behind the content (rotors + chains, like our slides) -->
    <div class="deco-layer" aria-hidden="true">
      <!-- Chains span the full width and run off both sides of the page -->
      <span class="deco deco--chain" data-shape="branch" style="top:1000px;--o:.08"></span>
      <span class="deco deco--chain" data-shape="wave" style="top:2150px;--o:.07"></span>
      <span class="deco deco--chain" data-shape="swoop" style="top:2650px;--flip:-1;--o:.08"></span>
      <span class="deco deco--rotor" style="--s:520px;left:-200px;top:1150px;--o:.07"></span>
      <span class="deco deco--rotor" style="--s:300px;right:-90px;top:2000px;--o:.09"></span>
      <span class="deco deco--rotor" style="--s:460px;left:-160px;top:3050px;--o:.06"></span>
    </div>
    <section class="section members-hero">
      <div class="container">
        <h1 class="title text-center" style="font-size:clamp(2.5rem,4.5vw + .5rem,4.25rem);margin-bottom:clamp(2.5rem,5vw,3.5rem)">Meet our Members</h1>
        <div data-render="members-by-team"></div>
      </div>
    </section>

    <div class="ribbon ribbon--inline" data-ribbon="Community • Join now • Applications open • Become a bike builder • Open to all majors" data-ribbon-closed="Community • Become a bike builder • Open to all majors • See you in the spring" data-shape="wave" data-band="#fdb515" data-ink="#003262"></div>

    <section class="section" style="padding-top:1rem">
      <div class="container">
        <p class="text-center"><a class="btn btn--white" href="apply.html">Become a Bike Builder</a></p>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
